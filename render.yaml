# Blueprint for a free Render Static Site.
# Requires a Git repo connected to Render (Billy to create/push).
services:
  - type: web
    name: brabazonpoint-site
    runtime: static
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
